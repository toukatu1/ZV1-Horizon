name: Build separate ZV-1 one-frame diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'gyro-probe-unified/**'
      - '.github/workflows/android-one-frame-probe.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android native tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'ndk;23.2.8568313' 'platforms;android-35'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Fetch official Gyroflow Core 1.6.3 and bundled lens profiles
        run: |
          mkdir -p original/third_party
          git clone --depth 1 --branch v1.6.3 https://github.com/gyroflow/gyroflow.git original/third_party/gyroflow-core
          mkdir -p original/third_party/gyroflow-core/resources/camera_presets
          curl --fail --location --retry 3 \
            'https://github.com/gyroflow/lens_profiles/releases/latest/download/profiles.cbor.gz' \
            --output original/third_party/gyroflow-core/resources/camera_presets/profiles.cbor.gz
          test -s original/third_party/gyroflow-core/resources/camera_presets/profiles.cbor.gz
      - name: Compile the one-frame Gyroflow Core bridge
        run: |
          cargo ndk -t arm64-v8a -o gyro-probe-unified/app/src/main/jniLibs build --release \
            --manifest-path gyro-probe-unified/Cargo.toml
          python3 gyro-probe-unified/verify_gyro_probe.py \
            gyro-probe-unified/app/src/main/jniLibs/arm64-v8a/libdance_gyroflow_jni.so
      - name: Build isolated Android diagnostic
        run: |
          gradle -p gyro-probe-unified --no-daemon assembleDebug
          cp gyro-probe-unified/app/build/outputs/apk/debug/app-debug.apk ZV1-one-frame-diagnostic.apk
          python3 gyro-probe-unified/verify_gyro_probe.py ZV1-one-frame-diagnostic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zv1-one-frame-diagnostic-untested
          path: ZV1-one-frame-diagnostic.apk
