plugins { id 'com.android.application' }

android {
    namespace 'jp.sakaguchi.zv1gyroprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.sakaguchi.zv1gyroprobe'
        minSdk 29
        targetSdk 28
        versionCode 1
        versionName 'one-frame-proof-1'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
